blueprint:
  name: "Librus: Copy School Events to a Calendar"
  description: >
    Copies tests, quizzes, trips, meetings and days off (only those that fall
    on a weekday) from Librus into a calendar of your choice - for example a
    family Google Calendar - so the whole family sees them outside Home
    Assistant.


    Runs once a day, right after a new Agenda entry appears and when an
    entry changes. The copies stay up to date: if a teacher moves a test,
    it's moved in your calendar too, and a cancelled one is removed. Only
    events this automation added are ever changed - they carry a short
    "[librus-sync:...]" tag at the end of their description. Entries copied
    by an older version of this blueprint (same title, same day) are taken
    over instead of being added twice.


    The target calendar must allow adding events from Home Assistant (Google
    Calendar, Local Calendar). Moving and removing also need it to allow
    editing and deleting events; otherwise new entries are still added and
    old ones stay.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/school_calendar_sync.yaml
  input:
    agenda_calendar:
      name: Agenda calendar
      description: The Librus "Agenda" (Terminarz) calendar of the student.
      selector:
        entity:
          integration: librus_synergia
          domain: calendar
    free_days_calendar:
      name: Free days calendar (optional)
      description: The Librus "Free days" calendar, to copy days off too. Leave empty to skip them.
      default: ""
      selector:
        entity:
          integration: librus_synergia
          domain: calendar
    target_calendar:
      name: Target calendar
      description: Where the events go, e.g. your family Google Calendar.
      selector:
        entity:
          domain: calendar
    categories:
      name: Agenda categories to copy
      description: >
        Comma-separated words matched against the Agenda category
        (case-insensitive, part of the word is enough). Leave empty to copy
        every entry.
      default: "sprawdzian, kartkówka, egzamin, wycieczka, zebranie"
      selector:
        text: {}
    days_ahead:
      name: Days ahead
      default: 30
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: days
    sync_time:
      name: Daily sync time
      default: "18:00:00"
      selector:
        time: {}
    add_name:
      name: Put the student's first name in front
      description: '"Ola: [Sprawdzian] Matematyka: …" - handy with more than one child.'
      default: true
      selector:
        boolean: {}

variables:
  agenda_cal: !input agenda_calendar
  free_cal: !input free_days_calendar
  target_cal: !input target_calendar
  categories_raw: !input categories
  days: !input days_ahead
  add_name: !input add_name
  # The device is named "E-dziennik <first> <last>" by the integration.
  student_first: >-
    {{ ((device_attr(agenda_cal, 'name') or '') | replace('E-dziennik ', '')).split(' ')[0] }}
  prefix: "{{ (student_first ~ ':') if add_name and student_first else '' }}"

triggers:
  - trigger: time
    at: !input sync_time
  - trigger: event
    event_type: librus_synergia_new_homework
  - trigger: event
    event_type: librus_synergia_agenda_changed

conditions: []

actions:
  - action: librus_synergia.sync_calendar
    data:
      device_id: "{{ device_id(agenda_cal) }}"
      target_calendar: "{{ target_cal }}"
      days: "{{ days | int(30) }}"
      categories: "{{ categories_raw }}"
      free_days: "{{ free_cal not in ['', none] }}"
      prefix: "{{ prefix }}"

mode: queued
max: 3
