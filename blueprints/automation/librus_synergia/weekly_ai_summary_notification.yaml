blueprint:
  name: "Librus: Weekly AI Summary Report"
  description: >
    Sends the weekly AI summary as soon as it is written (the
    `librus_synergia_weekly_summary` event): on the day and time set under
    the integration's Configure -> Weekly AI summary, or when you press
    "Generate weekly summary". Needs the weekly AI summary turned on there.


    Inside your action, use `{{ title }}` (e.g. "Ola - Weekly summary: Good")
    and `{{ message }}` (the report in the format you pick below), or
    `{{ message_short }}` / `{{ message_full }}` for a fixed format. Section
    names and statuses are in your Home Assistant language. With more than
    one child, the title already says whose summary it is.


    "Short" is the headline, one status line per section, the warning and the
    to-dos for the coming week, which fits a phone notification. "Full" adds
    every section's text; use it with a persistent notification, an e-mail or
    a messenger that shows long text.


    With "Written to: Parent and student" under Configure, two summaries
    arrive each week. Make one automation per phone and pick the version
    for each in "Version".


    Messenger cuts long messages (Telegram, WhatsApp)? Set "Send as" to "One
    message per section": your action then runs once per section, with that
    section's full text in `{{ message }}` (and in `{{ message_short }}` /
    `{{ message_full }}`, so an action written for one message works too)
    and "(1/4)" in `{{ title }}`. `{{ part }}` and `{{ parts }}` give the
    number of this message and the total. If even one section is too long
    for your messenger (CallMeBot for WhatsApp takes about 800 characters),
    set "Longest message" and a long section is split into several
    messages.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/weekly_ai_summary_notification.yaml
  input:
    report_action:
      name: Action
      description: >
        What to do with the report, e.g. "Send a notification" with
        `{{ title }}` as the title and `{{ message }}` as the message.
      default: []
      selector:
        action: {}
    audience:
      name: Version
      description: >
        Which summary this automation sends. Matters only with "Written to:
        Parent and student" under Configure, where two arrive each week -
        with "Any", this automation sends both.
      default: any
      selector:
        select:
          options:
            - label: Any
              value: any
            - label: For the parent
              value: parent
            - label: For the student
              value: student
    detail:
      name: Report format
      description: What `{{ message }}` contains.
      default: short
      selector:
        select:
          options:
            - label: Short (headline, section statuses, warning, to-dos)
              value: short
            - label: Full (adds the text of every section)
              value: full
    send_as:
      name: Send as
      description: >
        "One message per section" runs your action once per section, each
        time with that section's full text (the headline and warning go with
        the first one, the to-dos with the last one). Use it when your
        messenger shows only the start of a long message. "Report format"
        doesn't apply then.
      default: one
      selector:
        select:
          options:
            - label: One message
              value: one
            - label: One message per section
              value: per_section
    max_length:
      name: Longest message
      description: >
        With "One message per section": a section longer than this many
        characters is split into several messages, at line and sentence
        breaks. 0 = no limit. About 700 suits CallMeBot (WhatsApp).
      default: 0
      selector:
        number:
          min: 0
          max: 4000
          step: 50
          unit_of_measurement: characters
          mode: box
    sections:
      name: Sections
      description: >
        Which sections the report includes. "From the school" only exists
        when messages and announcements are included in the summary.
      default: [grades, attendance, behaviour, next_week, school_news]
      selector:
        select:
          multiple: true
          options:
            - label: Grades
              value: grades
            - label: Attendance
              value: attendance
            - label: Behaviour
              value: behaviour
            - label: Next week
              value: next_week
            - label: From the school
              value: school_news
    include_advice:
      name: Include the to-dos
      default: true
      selector:
        boolean: {}
    statuses:
      name: Send only for these weeks
      description: >
        The AI's overall call for the week. Leave all three to get a report
        every week, or keep only "Needs attention" to hear from it only when
        something is up.
      default: [good, ok, caution]
      selector:
        select:
          multiple: true
          options:
            - label: Good
              value: good
            - label: OK
              value: ok
            - label: Needs attention
              value: caution
    include_manual:
      name: Also send when generated from the button
      description: Off to send only the scheduled weekly report.
      default: true
      selector:
        boolean: {}

triggers:
  - trigger: event
    event_type: librus_synergia_weekly_summary

variables:
  wanted_sections: !input sections
  wanted_statuses: !input statuses
  include_advice: !input include_advice
  include_manual: !input include_manual
  wanted_audience: !input audience
  detail: !input detail
  send_as: !input send_as
  max_length: !input max_length
  section_order: [grades, attendance, behaviour, next_week, school_news]

conditions:
  - condition: template
    value_template: >-
      {{ (include_manual or not trigger.event.data.manual)
         and (wanted_audience == 'any' or trigger.event.data.audience == wanted_audience)
         and (trigger.event.data.status is none
              or trigger.event.data.status in wanted_statuses) }}

actions:
  - variables:
      title: >-
        {%- set d = trigger.event.data -%}
        {{ (d.student.split(' ')[0] ~ ' - ') if d.student else '' }}{{ d.labels.title }}{% if d.status %}: {{ d.labels.statuses[d.status] }}{% endif %}
      message_short: >-
        {%- set d = trigger.event.data -%}
        {%- set dots = {'good': '🟢', 'ok': '🔵', 'caution': '🟡'} -%}
        {%- set ns = namespace(lines=[d.headline or '']) -%}
        {%- set secs = d.sections or {} -%}
        {%- set shown = namespace(any=false) -%}
        {%- for key in section_order -%}
          {%- if key in wanted_sections and key in secs -%}
            {%- if not shown.any -%}{%- set ns.lines = ns.lines + [''] -%}{%- set shown.any = true -%}{%- endif -%}
            {%- set s = secs[key] -%}
            {%- set ns.lines = ns.lines + [dots.get(s.status, '⚪') ~ ' ' ~ d.labels.sections[key]
                ~ (': ' ~ d.labels.statuses[s.status] if s.status else '')] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if d.warning -%}
          {%- set ns.lines = ns.lines + ['', '⚠️ ' ~ d.warning] -%}
        {%- endif -%}
        {%- if include_advice and d.advice -%}
          {%- set ns.lines = ns.lines + ['', d.labels.advice ~ ':'] -%}
          {%- for a in d.advice -%}{%- set ns.lines = ns.lines + ['- ' ~ a] -%}{%- endfor -%}
        {%- endif -%}
        {{ ns.lines | join('\n') }}
      message_full: >-
        {%- set d = trigger.event.data -%}
        {%- set dots = {'good': '🟢', 'ok': '🔵', 'caution': '🟡'} -%}
        {%- set ns = namespace(lines=[d.headline or '']) -%}
        {%- set secs = d.sections or {} -%}
        {%- if d.warning -%}
          {%- set ns.lines = ns.lines + ['', '⚠️ ' ~ d.warning] -%}
        {%- endif -%}
        {%- for key in section_order -%}
          {%- if key in wanted_sections and key in secs -%}
            {%- set s = secs[key] -%}
            {%- set ns.lines = ns.lines + ['', dots.get(s.status, '⚪') ~ ' ' ~ d.labels.sections[key]
                ~ (' (' ~ d.labels.statuses[s.status] ~ ')' if s.status else ''), s.text] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if not secs and d.summary -%}
          {%- set ns.lines = ns.lines + ['', d.summary] -%}
        {%- endif -%}
        {%- if include_advice and d.advice -%}
          {%- set ns.lines = ns.lines + ['', d.labels.advice ~ ':'] -%}
          {%- for a in d.advice -%}{%- set ns.lines = ns.lines + ['- ' ~ a] -%}{%- endfor -%}
        {%- endif -%}
        {{ ns.lines | join('\n') }}
      message: "{{ message_full if detail == 'full' else message_short }}"
      # One text per section; the headline and warning open the first one,
      # the to-dos close the last one.
      message_parts: >-
        {%- set d = trigger.event.data -%}
        {%- set dots = {'good': '🟢', 'ok': '🔵', 'caution': '🟡'} -%}
        {%- set secs = d.sections or {} -%}
        {%- set ns = namespace(parts=[]) -%}
        {%- for key in section_order -%}
          {%- if key in wanted_sections and key in secs -%}
            {%- set s = secs[key] -%}
            {%- set ns.parts = ns.parts + [dots.get(s.status, '⚪') ~ ' ' ~ d.labels.sections[key]
                ~ (' (' ~ d.labels.statuses[s.status] ~ ')' if s.status else '') ~ '\n' ~ (s.text or '')] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if not ns.parts and d.summary -%}{%- set ns.parts = [d.summary] -%}{%- endif -%}
        {%- set head = namespace(lines=[d.headline] if d.headline else []) -%}
        {%- if d.warning -%}{%- set head.lines = head.lines + ['⚠️ ' ~ d.warning] -%}{%- endif -%}
        {%- if head.lines -%}
          {%- if ns.parts -%}
            {%- set ns.parts = [(head.lines | join('\n')) ~ '\n\n' ~ ns.parts[0]] + ns.parts[1:] -%}
          {%- else -%}
            {%- set ns.parts = [head.lines | join('\n')] -%}
          {%- endif -%}
        {%- endif -%}
        {%- if include_advice and d.advice and ns.parts -%}
          {%- set todo = namespace(lines=[d.labels.advice ~ ':']) -%}
          {%- for a in d.advice -%}{%- set todo.lines = todo.lines + ['- ' ~ a] -%}{%- endfor -%}
          {%- set ns.parts = ns.parts[:-1] + [ns.parts[-1] ~ '\n\n' ~ (todo.lines | join('\n'))] -%}
        {%- endif -%}
        {#- Longest message: a longer part becomes several, cut at line breaks,
            then sentences, then (a sentence still too long) by length. -#}
        {%- set limit = max_length | int(0) -%}
        {%- if send_as == 'per_section' and limit > 0 -%}
          {%- set out = namespace(parts=[]) -%}
          {%- for p in ns.parts -%}
            {%- set cur = namespace(text='', units=[]) -%}
            {%- for line in p.split('\n') -%}
              {%- if line | length <= limit -%}
                {%- set cur.units = cur.units + [line] -%}
              {%- else -%}
                {%- for sentence in line.split('. ') -%}
                  {%- set whole = sentence ~ ('' if loop.last else '.') -%}
                  {%- for i in range(0, whole | length, limit) -%}
                    {%- set cur.units = cur.units + [whole[i:i + limit]] -%}
                  {%- endfor -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for unit in cur.units -%}
              {%- if cur.text and (cur.text | length) + 1 + (unit | length) > limit -%}
                {%- set out.parts = out.parts + [cur.text] -%}
                {%- set cur.text = unit -%}
              {%- else -%}
                {%- set cur.text = (cur.text ~ '\n' ~ unit) if cur.text else unit -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if cur.text -%}{%- set out.parts = out.parts + [cur.text] -%}{%- endif -%}
          {%- endfor -%}
          {%- set ns.parts = out.parts -%}
        {%- endif -%}
        {{ ns.parts | tojson }}
      parts: "{{ message_parts | count if send_as == 'per_section' else 1 }}"
      part: 1
      # The title without "(1/4)", so each message's number replaces the last.
      base_title: "{{ title }}"
  - if:
      - condition: template
        value_template: "{{ send_as == 'per_section' and message_parts | count > 1 }}"
    then:
      - repeat:
          for_each: "{{ message_parts }}"
          sequence:
            - variables:
                part: "{{ repeat.index }}"
                message: "{{ repeat.item }}"
                # An action written with the fixed formats sends the part too,
                # not the whole report once per part.
                message_short: "{{ repeat.item }}"
                message_full: "{{ repeat.item }}"
                title: "{{ base_title }} ({{ repeat.index }}/{{ parts }})"
            - sequence: !input report_action
    else:
      - variables:
          message: "{{ message_parts[0] if send_as == 'per_section' and message_parts else message }}"
          message_short: "{{ message_parts[0] if send_as == 'per_section' and message_parts else message_short }}"
          message_full: "{{ message_parts[0] if send_as == 'per_section' and message_parts else message_full }}"
      - sequence: !input report_action

mode: queued
max: 5
