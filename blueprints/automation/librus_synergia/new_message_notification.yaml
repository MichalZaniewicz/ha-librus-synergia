blueprint:
  name: "Librus: New Message Notification"
  description: >
    Runs an action - typically "Send a notification" to your phone - with a
    one-line summary whenever a new Wiadomości (private message) arrives via
    the `librus_synergia_new_message` event. Checking this never marks the
    message read in real Librus - the integration only ever calls the
    message list/count endpoints.


    Inside your chosen action, use `{{ message_summary }}` for the ready-made
    summary, or reference the individual fields directly, e.g.
    `{{ trigger.event.data.sender }}` or `{{ trigger.event.data.topic }}`.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/new_message_notification.yaml
  input:
    notify_action:
      name: Notification action
      description: The action to run for each new message.
      selector:
        action: {}

triggers:
  - trigger: event
    event_type: librus_synergia_new_message

actions:
  - variables:
      message_summary: >-
        Nowa wiadomość od {{ trigger.event.data.sender }}: {{ trigger.event.data.topic }}
  - !input notify_action

mode: queued
max: 10
