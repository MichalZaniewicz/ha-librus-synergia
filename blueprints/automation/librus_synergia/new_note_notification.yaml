blueprint:
  name: "Librus: New Behaviour Notice Notification"
  description: >
    Runs an action - typically "Send a notification" to your phone - with a
    one-line summary whenever a new behaviour notice ("uwaga") appears via
    the `librus_synergia_new_note` event.


    Inside your chosen action, use `{{ note_summary }}` for the ready-made
    summary, or reference the individual fields directly, e.g.
    `{{ trigger.event.data.teacher }}` or `{{ trigger.event.data.text }}`.
    `{{ trigger.event.data.sentiment }}` says what kind of notice it is:
    "positive", "negative" or "neutral" - the summary names it, and you can
    use it in a condition (e.g. only negative notices).
    `{{ trigger.event.data.positive }}` is Librus's raw marker behind it
    (0 = negative, 1 = positive, 2 = neutral).


    If you use this blueprint for more than one child, `note_summary` is
    already prefixed with `{{ trigger.event.data.student }}` (the child's
    name) so one shared notification still says whose notice it is.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/new_note_notification.yaml
  input:
    notify_action:
      name: Notification action
      description: The action to run for each new behaviour notice.
      selector:
        action: {}

triggers:
  - trigger: event
    event_type: librus_synergia_new_note

actions:
  - variables:
      # HA trims rendered variable values, so the space is added where the
      # word is used, not stored in it.
      note_kind: >-
        {{ {'positive': 'pozytywna', 'negative': 'negatywna', 'neutral': 'neutralna'}.get(trigger.event.data.sentiment, '') }}
      note_summary: >-
        {{ (trigger.event.data.student ~ ': ') if trigger.event.data.student else '' }}Nowa uwaga{{ (' ' ~ note_kind) if note_kind else '' }}{{ ' od ' + trigger.event.data.teacher if trigger.event.data.teacher else '' }}:
        {{ trigger.event.data.text }}
  - !input notify_action

mode: queued
max: 10
