blueprint:
  name: "Librus: Heavy Week Ahead"
  description: >
    At a set time on the days you pick, counts the tests ("sprawdzian") and
    short tests ("kartkówka") in the coming school week and runs your
    action - typically "Send a notification" - when there are at least as
    many as you set. On a Saturday or Sunday it looks at the next week, on
    a weekday at the current one. Reads the Next exam sensor's
    `this_week` / `next_week` attributes, so it needs no extra requests.


    Use `{{ week_summary }}` in your action for a ready-made message
    ("Ola: w tym tygodniu 3 sprawdziany i 2 kartkówki - pon Matematyka,
    śr Biologia (kartkówka), ..."), or the parts: `{{ tests }}`,
    `{{ quizzes }}`, `{{ total }}`, `{{ week_items }}` (a list of `date`,
    `subject`, `category`, `kind`) and `{{ student_name }}`.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/heavy_week_notification.yaml
  input:
    next_exam_entity:
      name: Next exam sensor
      description: The Librus "Next exam" sensor for this student.
      selector:
        entity:
          integration: librus_synergia
          domain: sensor
    check_time:
      name: Time
      description: When to check.
      default: "18:00:00"
      selector:
        time: {}
    weekdays:
      name: Days
      description: Which days to check on. Sunday evening looks at the week ahead.
      default: ["7"]
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "1"
            - label: Tuesday
              value: "2"
            - label: Wednesday
              value: "3"
            - label: Thursday
              value: "4"
            - label: Friday
              value: "5"
            - label: Saturday
              value: "6"
            - label: Sunday
              value: "7"
    threshold:
      name: Tests in the week, at least
      description: Tests and short tests together. With 3, a week with 3 or more runs the action.
      default: 3
      selector:
        number:
          min: 1
          max: 15
          step: 1
          mode: box
    notify_action:
      name: Notification action
      description: The action to run for a heavy week.
      selector:
        action: {}

variables:
  next_exam_entity: !input next_exam_entity
  weekdays: !input weekdays
  threshold: !input threshold
  # Saturday and Sunday look at the coming week.
  week_key: "{{ 'next_week' if now().isoweekday() >= 6 else 'this_week' }}"

triggers:
  - trigger: time
    at: !input check_time

conditions:
  - condition: template
    value_template: >-
      {% set load = state_attr(next_exam_entity, week_key) %}
      {{ (now().isoweekday() | string) in weekdays
         and load is mapping and (load.total | int(0)) >= (threshold | int(3)) }}

actions:
  - variables:
      load: "{{ state_attr(next_exam_entity, week_key) }}"
      tests: "{{ load.tests | int(0) }}"
      quizzes: "{{ load.quizzes | int(0) }}"
      total: "{{ load.total | int(0) }}"
      week_items: "{{ load['items'] }}"
      # The device is named "E-dziennik <student>" by the integration.
      student_name: >-
        {{ (device_attr(next_exam_entity, 'name') or '') | replace('E-dziennik ', '') }}
      week_summary: >-
        {%- macro plural(n, one, few, many) -%}
          {{ one if n == 1 else (few if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else many) }}
        {%- endmacro -%}
        {%- set days = ['pon', 'wt', 'śr', 'czw', 'pt', 'sob', 'niedz'] -%}
        {%- set parts = [] -%}
        {%- if tests | int > 0 -%}{%- set parts = parts + [tests ~ ' ' ~ plural(tests | int, 'sprawdzian', 'sprawdziany', 'sprawdzianów')] -%}{%- endif -%}
        {%- if quizzes | int > 0 -%}{%- set parts = parts + [quizzes ~ ' ' ~ plural(quizzes | int, 'kartkówka', 'kartkówki', 'kartkówek')] -%}{%- endif -%}
        {%- set ns = namespace(list=[]) -%}
        {%- for item in load['items'] -%}
          {%- set day = days[as_datetime(item.date).weekday()] -%}
          {%- set ns.list = ns.list + [day ~ ' ' ~ (item.subject or '?') ~ (' (kartkówka)' if item.kind == 'quiz' else '')] -%}
        {%- endfor -%}
        {{ (student_name ~ ': ') if student_name else '' }}{{ 'w tym tygodniu' if week_key == 'this_week' else 'w nadchodzącym tygodniu' }} {{ parts | join(' i ') }} - {{ ns.list | join(', ') }}
  - sequence: !input notify_action

mode: single
