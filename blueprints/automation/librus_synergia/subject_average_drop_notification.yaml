blueprint:
  name: "Librus: Subject Average Dropped Below Threshold"
  description: >
    Runs your action when a subject-average sensor falls below a value you
    set - e.g. "tell me if any subject slips under 3.5". Fires once on the
    downward crossing, not repeatedly while it stays low, and again only
    after it has recovered above the threshold and dropped back.


    Pick one or more `sensor.*_srednia` / subject-average entities from the
    Librus integration. Use `{{ drop_summary }}` in your action, or the raw
    fields: `{{ trigger.to_state.state }}` (the new average),
    `{{ trigger.from_state.state }}` (the previous one),
    `{{ trigger.to_state.attributes.subject }}` (the subject name).
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/subject_average_drop_notification.yaml
  input:
    average_sensors:
      name: Subject-average sensors
      description: The Librus subject-average sensor(s) to watch.
      selector:
        entity:
          multiple: true
          filter:
            - integration: librus_synergia
              domain: sensor
    threshold:
      name: Alert when average drops below
      description: A crossing from at-or-above this value to below it runs the action.
      default: 3.5
      selector:
        number:
          min: 1
          max: 6
          step: 0.05
          mode: box
    sustain_for:
      name: Only if it stays below this long
      description: >
        Guards against a brief dip from a single low grade being corrected
        moments later. Leave at 0 to fire immediately on the crossing.
      default: 0
      selector:
        duration: {}
    notify_action:
      name: Notification action
      description: The action to run when a subject average drops below the threshold.
      selector:
        action: {}

variables:
  threshold: !input threshold

triggers:
  - trigger: numeric_state
    entity_id: !input average_sensors
    below: !input threshold
    for: !input sustain_for

conditions:
  # numeric_state also fires when the sensor first gets a value (from
  # "unknown"/"unavailable"); only act on a real downward crossing.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ('unknown', 'unavailable', 'none')
         and (trigger.from_state.state | float(0)) >= (threshold | float(3.5)) }}

actions:
  - variables:
      subject_name: >-
        {{ trigger.to_state.attributes.subject
           | default(trigger.to_state.attributes.friendly_name, true) }}
      drop_summary: >-
        Średnia {{ ('z ' ~ subject_name ~ ' ') if subject_name else '' }}spadła do
        {{ trigger.to_state.state }} (było {{ trigger.from_state.state }}).
  - !input notify_action

mode: queued
max: 10
