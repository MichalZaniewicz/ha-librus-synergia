blueprint:
  name: "Librus: New Grade Notification"
  description: >
    Runs an action - typically "Send a notification" to your phone - with a
    one-line summary whenever a new grade appears via the
    `librus_synergia_new_grade` event.


    Inside your chosen action, use `{{ grade_summary }}` for the ready-made
    summary, or reference the individual fields directly, e.g.
    `{{ trigger.event.data.subject }}` or `{{ trigger.event.data.value }}`.
    If you use this blueprint for more than one child, `grade_summary` is
    already prefixed with `{{ trigger.event.data.student }}` (the child's
    name) so one shared notification still says whose grade it is.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/new_grade_notification.yaml
  input:
    notify_action:
      name: Notification action
      description: The action to run for each new grade.
      selector:
        action: {}

triggers:
  - trigger: event
    event_type: librus_synergia_new_grade

actions:
  - variables:
      grade_summary: >-
        {{ (trigger.event.data.student ~ ': ') if trigger.event.data.student else '' }}Nowa ocena: {{ trigger.event.data.value }}
        {{ '(' + trigger.event.data.subject + ')' if trigger.event.data.subject else '' }}
  - !input notify_action

mode: queued
max: 10
