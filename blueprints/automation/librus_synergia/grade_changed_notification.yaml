blueprint:
  name: "Librus: Grade Changed Notification"
  description: >
    Runs an action - typically "Send a notification" to your phone - when a
    teacher edits a grade after giving it (a "bz" for missing homework turned
    into a 5, another weight, no longer counting towards the average) or
    deletes it, via the `librus_synergia_grade_changed` event.


    Inside your chosen action, use `{{ change_summary }}` for the ready-made
    message, e.g. "Ola: ocena zmieniona (Matematyka): bz → 5", or the event's
    fields directly: `{{ trigger.event.data.change }}` (changed / removed),
    `{{ trigger.event.data.subject }}`, `{{ trigger.event.data.value }}`,
    `{{ trigger.event.data.previous }}` (the old values),
    `{{ trigger.event.data.changed_fields }}`, `{{ trigger.event.data.kind }}`,
    `{{ trigger.event.data.average_before }}` /
    `{{ trigger.event.data.average_after }}` (ordinary grades). With several
    children the message starts with the child's name. Needs integration
    0.12.40 or newer.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/grade_changed_notification.yaml
  input:
    include_removed:
      name: Deleted grades too
      description: Also notify when a teacher deletes a grade.
      default: true
      selector:
        boolean: {}
    include_average:
      name: Show the average change
      description: >
        Add a line with the subject's average before and after the change,
        e.g. "Średnia: 3,80 → 4,10" (ordinary grades only).
      default: true
      selector:
        boolean: {}
    notify_action:
      name: Notification action
      description: The action to run for each edited (or deleted) grade.
      selector:
        action: {}

variables:
  include_removed: !input include_removed
  include_average: !input include_average

triggers:
  - trigger: event
    event_type: librus_synergia_grade_changed

conditions:
  - condition: template
    value_template: "{{ trigger.event.data.change == 'changed' or include_removed }}"

actions:
  - variables:
      change_summary: |-
        {%- set d = trigger.event.data -%}
        {%- set p = d.previous or {} -%}
        {#- Points read better as numbers ("26", "9,5") than Librus's "26.00". -#}
        {%- macro num(v) -%}{{ (('%g' | format(v)) | replace('.', ',')) if v is number else v }}{%- endmacro -%}
        {%- set who = (d.student ~ ': ') if d.student else '' -%}
        {%- set subject = (' (' ~ d.subject ~ ')') if d.subject else '' -%}
        {%- if d.change == 'removed' -%}
        {{ who }}usunięta ocena {{ num(d.points) if d.kind == 'point' and d.points is number else d.value }}{{ subject }}
        {%- else -%}
          {%- set parts = [] -%}
          {%- if d.kind == 'point' and 'points' in (d.changed_fields or []) -%}
            {%- set parts = parts + [num(p.points) ~ ' → ' ~ num(d.points) ~ ' pkt'] -%}
          {%- elif 'value' in (d.changed_fields or []) -%}
            {%- set parts = parts + [(p.value if p.value not in [none, ''] else '?') ~ ' → ' ~ d.value] -%}
          {%- endif -%}
          {%- if 'max_points' in (d.changed_fields or []) -%}
            {%- set parts = parts + ['maks. ' ~ num(p.max_points) ~ ' → ' ~ num(d.max_points) ~ ' pkt'] -%}
          {%- endif -%}
          {%- if 'weight' in (d.changed_fields or []) -%}
            {%- set parts = parts + ['waga ' ~ p.weight ~ ' → ' ~ d.weight] -%}
          {%- endif -%}
          {%- if 'counts_to_average' in (d.changed_fields or []) -%}
            {%- set parts = parts + ['liczy się do średniej' if d.counts_to_average else 'nie liczy się do średniej'] -%}
          {%- endif -%}
        {{ who }}ocena zmieniona{{ subject }}: {{ parts | join(', ') if parts else d.value }}
        {%- endif -%}
        {%- if include_average and d.average_after is number and d.average_before is number and d.average_before != d.average_after %}
        Średnia: {{ ('%.2f' | format(d.average_before)) | replace('.', ',') }} → {{ ('%.2f' | format(d.average_after)) | replace('.', ',') }}
        {%- endif -%}
  - sequence: !input notify_action

mode: queued
max: 10
