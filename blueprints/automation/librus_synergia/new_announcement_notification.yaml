blueprint:
  name: "Librus: New Announcement Notification"
  description: >
    Runs an action - typically "Send a notification" to your phone - with the
    title whenever a new school announcement ("ogłoszenie") appears via the
    `librus_synergia_new_announcement` event.


    Inside your chosen action, use `{{ announcement_summary }}` for a
    ready-made line (the child's name prefixed, if this blueprint is used
    for more than one), or `{{ trigger.event.data.subject }}` directly for
    just the announcement's title.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/new_announcement_notification.yaml
  input:
    notify_action:
      name: Notification action
      description: The action to run for each new announcement.
      selector:
        action: {}

triggers:
  - trigger: event
    event_type: librus_synergia_new_announcement

actions:
  - variables:
      announcement_summary: >-
        {{ (trigger.event.data.student ~ ': ') if trigger.event.data.student else '' }}{{ trigger.event.data.subject }}
  - !input notify_action

mode: queued
max: 10
