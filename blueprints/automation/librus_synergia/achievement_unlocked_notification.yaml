blueprint:
  name: "Librus: Achievement Unlocked"
  description: >
    Runs your action - typically "Send a notification" - whenever a new
    gamification milestone fires via the
    `librus_synergia_achievement_unlocked` event - one of 20 badges, e.g. a
    first six, 5/10/25 sixes, a good-grade streak, a test at 5+, a
    correction to a higher grade, a full month at school, or a streak
    without an absence or a negative behaviour note. Each badge (and each
    tier of one) fires at most once ever, so this never spams - a bad grade
    breaking a streak later doesn't "revoke" one already earned. Badges
    earned before the integration was installed or updated are recorded
    silently, not announced.


    Inside your chosen action, use `{{ achievement_text }}` for a
    ready-made line, or `{{ trigger.event.data.title }}` directly.
    If you use this blueprint for more than one child, `achievement_text`
    is already prefixed with `{{ trigger.event.data.student }}` (the
    child's name) so one shared notification still says who earned it.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/achievement_unlocked_notification.yaml
  input:
    notify_action:
      name: Notification action
      description: The action to run for each newly unlocked achievement.
      selector:
        action: {}

triggers:
  - trigger: event
    event_type: librus_synergia_achievement_unlocked

actions:
  - variables:
      achievement_text: >-
        {{ (trigger.event.data.student ~ ': ') if trigger.event.data.student else '' }}Odznaka odblokowana: {{ trigger.event.data.title }}
  - !input notify_action

mode: queued
max: 10
