blueprint:
  name: "Librus: Achievement Unlocked"
  description: >
    Runs your action - typically "Send a notification" - whenever a new
    gamification milestone fires via the
    `librus_synergia_achievement_unlocked` event: a first six, a good-grade
    streak (5/10/20 in a row), or a week/month/3-months streak without an
    absence or a negative behaviour note. Each achievement fires at most
    once ever, so this never spams - a bad grade breaking a streak later
    doesn't "revoke" one already earned.


    Inside your chosen action, use `{{ achievement_text }}` for a
    ready-made line, or `{{ trigger.event.data.title }}` directly.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/achievement_unlocked_notification.yaml
  input:
    notify_action:
      name: Notification action
      description: The action to run for each newly unlocked achievement.
      selector:
        action: {}

triggers:
  - trigger: event
    event_type: librus_synergia_achievement_unlocked

actions:
  - variables:
      achievement_text: "Odznaka odblokowana: {{ trigger.event.data.title }}"
  - !input notify_action

mode: queued
max: 10
