blueprint:
  name: "Librus: Morning Briefing"
  description: >
    At a set time on school days, builds a short briefing - the first
    lesson and room, the lucky number (if it's today's), and whether a
    test is coming up in the next few days - and runs your action, e.g.
    "speak on a media player" or "send a notification".


    Use `{{ briefing_text }}` in your action. Nothing runs on weekends, or
    on a day without lessons (when the Next lesson sensor already points at
    another day). If the briefing time is after the day's first lesson has
    started, the message names the next lesson instead ("Następna lekcja").


    The first lesson is recognised with the School start sensor. If you
    leave that input empty, the blueprint looks for it on the same device as
    the Next lesson sensor by itself.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/morning_briefing_notification.yaml
  input:
    briefing_time:
      name: Time
      description: When to run, on Mon-Fri.
      default: "07:15:00"
      selector:
        time: {}
    next_lesson_entity:
      name: Next lesson sensor
      description: The Librus "Next lesson" sensor for this student.
      selector:
        entity:
          integration: librus_synergia
          domain: sensor
    school_start_entity:
      name: School start sensor (optional)
      description: >
        The Librus "School start" sensor for this student. Leave empty to
        find it automatically on the Next lesson sensor's device.
      default: ""
      selector:
        entity:
          integration: librus_synergia
          domain: sensor
          device_class: timestamp
    lucky_number_entity:
      name: Lucky number sensor (optional)
      description: Include today's lucky number when it's genuinely for today.
      default: ""
      selector:
        entity:
          integration: librus_synergia
          domain: sensor
    next_exam_entity:
      name: Next exam sensor (optional)
      description: Mention an upcoming test when it's within 3 days.
      default: ""
      selector:
        entity:
          integration: librus_synergia
          domain: sensor
          device_class: date
    notify_action:
      name: Action
      description: What to do with the briefing (e.g. send a notification, or speak it).
      selector:
        action: {}

variables:
  next_lesson_entity: !input next_lesson_entity
  school_start_entity: !input school_start_entity
  lucky_number_entity: !input lucky_number_entity
  next_exam_entity: !input next_exam_entity

triggers:
  - trigger: time
    at: !input briefing_time

conditions:
  - condition: template
    value_template: "{{ now().weekday() < 5 }}"
  # Only when the next lesson is today - otherwise there are no (more)
  # lessons today and the sensor already points at another day.
  - condition: template
    value_template: >-
      {{ states(next_lesson_entity) not in ['unknown', 'unavailable', 'none', 'None', '']
         and state_attr(next_lesson_entity, 'date') == (now().date() | string) }}

actions:
  - variables:
      first_lesson: "{{ states(next_lesson_entity) }}"
      first_start: "{{ state_attr(next_lesson_entity, 'start') | default('', true) }}"
      first_room: "{{ state_attr(next_lesson_entity, 'classroom') | default('', true) }}"
      # The next lesson is the day's first one when its start equals the
      # School start sensor's state (given, or found on the same device as
      # a timestamp sensor with that exact value - the School end sensor is
      # a lesson's end and can't match a start).
      is_first_lesson: >-
        {%- set ts = as_timestamp(first_start, none) -%}
        {%- if ts is none -%}False
        {%- elif school_start_entity -%}{{ as_timestamp(states(school_start_entity), none) == ts }}
        {%- else -%}
          {%- set ns = namespace(first=false) -%}
          {%- set dev = device_id(next_lesson_entity) -%}
          {%- for e in (device_entities(dev) if dev else []) -%}
            {%- if e.startswith('sensor.') and e != next_lesson_entity
                  and state_attr(e, 'device_class') == 'timestamp'
                  and as_timestamp(states(e), none) == ts -%}
              {%- set ns.first = true -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.first }}
        {%- endif -%}
      lucky: >-
        {{ states(lucky_number_entity)
           if lucky_number_entity
           and states(lucky_number_entity) not in ['unknown', 'unavailable', 'none']
           and state_attr(lucky_number_entity, 'is_today')
           else '' }}
      exam_days: >-
        {{ state_attr(next_exam_entity, 'days_until')
           if next_exam_entity and states(next_exam_entity) not in ['unknown', 'unavailable', 'none']
           else none }}
      exam_text: >-
        {%- set d = exam_days | int(99) if exam_days is not none else 99 -%}
        {{ 'Sprawdzian dziś!' if d == 0 else ('Sprawdzian jutro!' if d == 1 else (('Sprawdzian za ' ~ d ~ ' dni!') if 0 < d <= 3 else '')) }}
      briefing_text: >-
        {{ 'Pierwsza lekcja' if is_first_lesson else 'Następna lekcja' }}: {{ first_lesson }}{{ (' o ' ~ first_start[11:16]) if first_start else '' }}{{ (', sala ' ~ first_room) if first_room else '' }}.
        {{ ('Szczęśliwy numerek: ' ~ lucky ~ '.') if lucky else '' }}
        {{ exam_text }}
  - !input notify_action

mode: single
