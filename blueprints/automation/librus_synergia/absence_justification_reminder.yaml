blueprint:
  name: "Librus: Absences To Justify Reminder"
  description: >
    At a set time on the days you pick, checks the Unexcused absences
    sensor and runs your action - typically "Send a notification" - only
    while there is still something to justify. Silent once everything is
    excused. Unlike the Unexcused Absence Notification blueprint (one
    message when a new absence appears), this one keeps reminding until
    it's dealt with.


    Days you've already sent a justification for (and the school hasn't
    rejected it) are left out, so the reminder stops once everything is
    sent, not only once it's accepted.


    Use `{{ reminder_text }}` in your action for a ready-made message
    ("Ola: Dni do usprawiedliwienia: 2 (05.09, 02.09)."), or the parts
    directly: `{{ absence_dates }}` (e.g. "05.09, 02.09" - the days still
    to justify, the 10 most recent at most), `{{ absence_days_count }}`
    (how many days that list has), `{{ unexcused_count }}` (the sensor's
    state: unexcused LESSONS in total, one per missed lesson, including days
    a justification was already sent for) and `{{ student_name }}`.
  domain: automation
  source_url: https://github.com/MichalZaniewicz/ha-librus-synergia/blob/main/blueprints/automation/librus_synergia/absence_justification_reminder.yaml
  input:
    unexcused_absences_entity:
      name: Unexcused absences sensor
      description: The Librus "Unexcused absences" sensor for this student.
      selector:
        entity:
          integration: librus_synergia
          domain: sensor
    check_time:
      name: Time
      description: When to check.
      default: "18:00:00"
      selector:
        time: {}
    weekdays:
      name: Days
      description: Which days to check on.
      default: ["1", "2", "3", "4", "5"]
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "1"
            - label: Tuesday
              value: "2"
            - label: Wednesday
              value: "3"
            - label: Thursday
              value: "4"
            - label: Friday
              value: "5"
            - label: Saturday
              value: "6"
            - label: Sunday
              value: "7"
    notify_action:
      name: Notification action
      description: The action to run while there are absences left to justify.
      selector:
        action: {}

variables:
  unexcused_absences_entity: !input unexcused_absences_entity
  weekdays: !input weekdays

triggers:
  - trigger: time
    at: !input check_time

conditions:
  - condition: template
    value_template: >-
      {% set awaiting = state_attr(unexcused_absences_entity, 'awaiting_justification') %}
      {{ (now().isoweekday() | string) in weekdays
         and ((awaiting | count > 0) if awaiting is not none
              else (states(unexcused_absences_entity) | int(0)) > 0) }}

actions:
  - variables:
      # The sensor's state counts unexcused LESSONS (one record per missed
      # lesson, so a whole day off is 6-8), including days a justification
      # was already sent for. The message talks about DAYS instead, taken
      # from the same list it shows, so the number and the list agree.
      unexcused_count: "{{ states(unexcused_absences_entity) | int(0) }}"
      # `awaiting_justification` (or, on older versions, `recent_dates`)
      # lists distinct days, newest first, at most 10 - "YYYY-MM-DD".
      absence_day_list: >-
        {%- set awaiting = state_attr(unexcused_absences_entity, 'awaiting_justification') -%}
        {{ awaiting if awaiting is not none else (state_attr(unexcused_absences_entity, 'recent_dates') or []) }}
      absence_days_count: "{{ absence_day_list | count }}"
      absence_dates: >-
        {%- set ns = namespace(dates=[]) -%}
        {%- for d in absence_day_list -%}
          {%- set ns.dates = ns.dates + [d[8:10] ~ '.' ~ d[5:7]] -%}
        {%- endfor -%}
        {{ ns.dates | join(', ') }}
      # The device is named "E-dziennik <student>" by the integration.
      student_name: >-
        {{ (device_attr(unexcused_absences_entity, 'name') or '') | replace('E-dziennik ', '') }}
      # Built from the ISO list again rather than from `absence_dates`: HA
      # turns a lone "12.10" variable into the number 12.1.
      reminder_text: >-
        {%- set ns = namespace(dates=[]) -%}
        {%- for d in absence_day_list -%}
          {%- set ns.dates = ns.dates + [d[8:10] ~ '.' ~ d[5:7]] -%}
        {%- endfor -%}
        {{ (student_name ~ ': ') if student_name else '' }}{{ ('Dni do usprawiedliwienia: ' ~ ns.dates | count ~ ' (' ~ ns.dates | join(', ') ~ ').') if ns.dates else ('Nieusprawiedliwione lekcje: ' ~ unexcused_count ~ '.') }}
  - !input notify_action

mode: single
