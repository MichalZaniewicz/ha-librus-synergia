refresh:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: librus_synergia

get_message:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: librus_synergia
    message_id:
      required: true
      example: "100001"
      selector:
        text:
    mailbox:
      required: false
      example: "inbox"
      default: "inbox"
      selector:
        select:
          custom_value: true
          options:
            - "inbox"
            - "substitutions"
            - "alerts"
            - "notes"
            - "absences"
            - "justifications"
            - "trash"
            - "outbox"
            - "archive/inbox"

get_grades:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: librus_synergia
    subject_id:
      required: false
      example: 42005
      selector:
        number:
          mode: box

get_message_recipients:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: librus_synergia

send_message:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: librus_synergia
    recipient:
      required: false
      example: "wychowawca"
      selector:
        text:
          multiple: true
    topic:
      required: false
      example: "Nieobecność jutro"
      selector:
        text:
    message:
      required: true
      example: "Dzień dobry, jutro Ola będzie nieobecna z powodu wizyty u lekarza."
      selector:
        text:
          multiline: true
    reply_to:
      required: false
      example: "100001"
      selector:
        text:
    dry_run:
      required: false
      default: false
      selector:
        boolean:

mark_announcement_read:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: librus_synergia
    announcement_id:
      required: false
      example: "LID-NBOARD-NOTICE-1"
      selector:
        text:
          multiple: true
mark_message_read:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: librus_synergia
    message_id:
      required: false
      example: "100002"
      selector:
        text:
          multiple: true
    mailbox:
      required: false
      default: inbox
      selector:
        select:
          options:
            - inbox
            - substitutions
            - alerts
            - justifications
            - archive/inbox
withdraw_message:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: librus_synergia
    message_id:
      required: true
      example: "100002"
      selector:
        text:
